name: Polymarket Data Sync

on:
  # Run every 5 minutes to maintain fresh price snapshots for historical tracking
  # This frequency ensures /api/movers has sufficient data for 1h/6h/24h windows
  # Expected snapshots per window: 1h=12, 6h=72, 24h=288
  schedule:
    - cron: '*/15 * * * *'

  # Allow manual trigger for testing or immediate sync
  workflow_dispatch:

# Prevent concurrent runs but don't cancel scheduled jobs
concurrency:
  group: polymarket-sync
  cancel-in-progress: false

jobs:
  sync-markets:
    runs-on: ubuntu-latest

    steps:
      - name: Log sync start
        run: |
          echo "=== Polymarket Data Sync START === $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "Workflow run: ${{ github.run_number }}"
          echo "Triggered by: ${{ github.event_name }}"
          echo "Snapshot frequency: Every 5 minutes (12 snapshots/hour)"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch and sync markets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # DEBUG_MARKET_ID: "1249293"  # Uncomment to enable debug mode for a specific market
        run: npm run fetch-markets

      - name: Log sync end
        if: always()
        run: |
          echo "=== Polymarket Data Sync END === $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Market data sync completed successfully"
          else
            echo "❌ Market data sync failed"
          fi

